# Reviewed CMI Announcer conversion, 4 November 2026.
# Manual staging config: disabled by default. The maintained test server enables it locally.
# See docs/plans/scheduledtips-cmi-migration.md for source mapping, disabled entries,
# enforced audience rules, testing and the manual live cutover/rollback.
# All entries are MiniMessage. Tips supplies its own prefix and guidance controls.
# Targeting requires the new ScheduledTips JAR. All 8 approved holds are enabled; Celebration was removed.
# Per-player weighted rotation; 1500 seconds / 2 players preserves the old CMI cadence.
debug: false
tips:
  - "menu|<color:#d8e2dc>Explore server activities and useful commands in <click:run_command:'/menu'><hover:show_text:'Open /menu.'><color:#ffd166>/menu</color></hover></click>.</color>"
  - "rules|<color:#d8e2dc>Respect other players and their builds. Read <click:run_command:'/rules'><hover:show_text:'Open /rules.'><color:#ffd166>/rules</color></hover></click> before taking items or changing someone else's build.</color>"
  - "oneblock|<color:#d8e2dc>Looking for a different challenge? Explore <click:run_command:'/gametype menu oneblock'><hover:show_text:'Open /gametype menu oneblock.'><color:#ffd166>OneBlock</color></hover></click> from the game-type menu.</color>"
  - "homes|<color:#d8e2dc>Use <click:run_command:'/cmi homes'><hover:show_text:'Open /cmi homes.'><color:#ffd166>/homes</color></hover></click> to see your saved homes. Home limits depend on your group; check <click:run_command:'/groups'><hover:show_text:'Open /groups.'><color:#ffd166>/groups</color></hover></click>.</color>"
  - "mcmmo|<color:#d8e2dc>Build mcMMO skills as you play to unlock abilities and perks. Start with <click:run_command:'/mcmmo'><hover:show_text:'Open /mcmmo.'><color:#ffd166>/mcmmo</color></hover></click>.</color>"
  - "discord_ticket|<color:#d8e2dc>Found a bug or broken item? Use <click:run_command:'/discord'><hover:show_text:'Open /discord.'><color:#ffd166>/discord</color></hover></click> to find the community Discord and open a support ticket.</color>"
  - "protection|<color:#d8e2dc>Learn about container protection, <click:run_command:'/chests'><hover:show_text:'Open /chests.'><color:#ffd166>/lock, /unlock and /cmodify</color></hover></click> before sharing access with a friend.</color>"
  - "fish|<color:#d8e2dc>Explore Pyro Fishing with <click:run_command:'/fish menu'><hover:show_text:'Open /fish menu.'><color:#ffd166>/fish</color></hover></click>.</color>"
  - "groups|<color:#d8e2dc>Explore server groups and their perks with <click:run_command:'/groups'><hover:show_text:'Open /groups.'><color:#ffd166>/groups</color></hover></click>. The <click:run_command:'/ranks'><hover:show_text:'Open /ranks.'><color:#ffd166>/ranks</color></hover></click> command opens the same information.</color>"
  - "visit|<color:#d8e2dc>Share your build with a public visit point using <click:suggest_command:'/visit set'><hover:show_text:'Put /visit set in chat; review it before sending.'><color:#ffd166>/visit set</color></hover></click>.</color>"
  - "vote|<color:#d8e2dc>Find the current voting links and rewards with <click:run_command:'/vote'><hover:show_text:'Open /vote.'><color:#ffd166>/vote</color></hover></click>.</color>"
  - "back|<color:#d8e2dc>Need your previous location? Review <click:suggest_command:'/cmi back'><hover:show_text:'Put /cmi back in chat; review it before sending.'><color:#ffd166>/back</color></hover></click> before teleporting; access and cooldowns may apply.</color>"
  - "mine|<color:#d8e2dc>Explore Pyro Mining with <click:run_command:'/mine menu'><hover:show_text:'Open /mine menu.'><color:#ffd166>/mine</color></hover></click>.</color>"
  - "community_2011|<color:#d8e2dc>The 1MoreBlock.com community has been playing together since 2011.</color>"
  - "jobs_browse|<color:#d8e2dc>Browse available jobs with <click:run_command:'/jobs browse'><hover:show_text:'Open /jobs browse.'><color:#ffd166>/jobs browse</color></hover></click>. Choose work that fits the way you like to play.</color>"
  - "reply|<color:#d8e2dc>Reply to your most recent private message with <click:suggest_command:'/r '><hover:show_text:'Put /r in chat; review it before sending.'><color:#ffd166>/r</color></hover></click> and your message.</color>"
  - "farm|<color:#d8e2dc>Explore Pyro Farming with <click:run_command:'/farm menu'><hover:show_text:'Open /farm menu.'><color:#ffd166>/farm</color></hover></click>.</color>"
  - "shops|<color:#d8e2dc>Visit player and admin shops with <click:suggest_command:'/cmi warp shops'><hover:show_text:'Put /cmi warp shops in chat; review it before sending.'><color:#ffd166>/warp shops</color></hover></click>. Your group determines your own chest-shop allowance; see <click:run_command:'/groups'><hover:show_text:'Open /groups.'><color:#ffd166>/groups</color></hover></click>.</color>"
  - "profile|<color:#d8e2dc>Open <click:run_command:'/tips'><hover:show_text:'Open /tips.'><color:#ffd166>/tips</color></hover></click> to review individual tips, or <click:run_command:'/guidance'><hover:show_text:'Open /guidance.'><color:#ffd166>/guidance</color></hover></click> to choose fewer hints, turn optional hints off, or pause them for free.</color>"
  - "achievements|<color:#d8e2dc>Explore achievements and their current goals with <click:run_command:'/achievements'><hover:show_text:'Open /achievements.'><color:#ffd166>/achievements</color></hover></click>.</color>"
  - "dback|<color:#d8e2dc>After a death, <click:suggest_command:'/cmi dback'><hover:show_text:'Put /cmi dback in chat; review it before sending.'><color:#ffd166>/dback</color></hover></click> may return you to your death location. Check that it is safe before using it; access and cooldowns may apply.</color>"
  - "invite_friends|<color:#d8e2dc>Enjoying the server? Invite your friends to join the community.</color>"
  - "mcmmo_commands|<color:#d8e2dc>Check your mcMMO progress with <click:run_command:'/mcstats'><hover:show_text:'Open /mcstats.'><color:#ffd166>/mcstats</color></hover></click>, <click:run_command:'/mcrank'><hover:show_text:'Open /mcrank.'><color:#ffd166>/mcrank</color></hover></click> and <click:run_command:'/mctop'><hover:show_text:'Open /mctop.'><color:#ffd166>/mctop</color></hover></click>.</color>"
  - "market|<color:#d8e2dc>Browse the player market with <click:run_command:'/market'><hover:show_text:'Open /market.'><color:#ffd166>/market</color></hover></click>. Review prices before buying or listing items.</color>"
  - "sit|<color:#d8e2dc>Take a seat with <click:suggest_command:'/cmi sit'><hover:show_text:'Put /cmi sit in chat; review it before sending.'><color:#ffd166>/sit</color></hover></click>, or try right-clicking a stair with an empty hand.</color>"
  - "discord_announcement|<color:#d8e2dc>Find community news and announcements on <click:run_command:'/discord'><hover:show_text:'Open /discord.'><color:#ffd166>/discord</color></hover></click>.</color>"
  - "pvp|<color:#d8e2dc>Check your PvP setting with <click:run_command:'/pvp status'><hover:show_text:'Open /pvp status.'><color:#ffd166>/pvp status</color></hover></click>. Review it before choosing to toggle PvP.</color>"
  - "warp_signs|<color:#d8e2dc>Learn about server commands at <click:suggest_command:'/cmi warp signs'><hover:show_text:'Put /cmi warp signs in chat; review it before sending.'><color:#ffd166>/warp signs</color></hover></click>.</color>"
  - "hop|<color:#d8e2dc>Curious which mobs you can ride? Read <click:run_command:'/hop info'><hover:show_text:'Open /hop info.'><color:#ffd166>/hop info</color></hover></click> for the list and controls.</color>"
  - "forums|<color:#d8e2dc>Find community discussions and feature information with <click:run_command:'/forums'><hover:show_text:'Open /forums.'><color:#ffd166>/forums</color></hover></click>.</color>"
  - "points_greet|<color:#d8e2dc>Welcome joining players by name. Check <click:run_command:'/points'><hover:show_text:'Open /points.'><color:#ffd166>/points</color></hover></click> for the welcome-points shop and information.</color>"
  - "warps|<color:#d8e2dc>Explore public server destinations with <click:run_command:'/warps'><hover:show_text:'Open /warps.'><color:#ffd166>/warps</color></hover></click>.</color>"
  - "party|<color:#d8e2dc>Explore mcMMO parties with <click:run_command:'/party'><hover:show_text:'Open /party.'><color:#ffd166>/party</color></hover></click>.</color>"
  - "fish_shop|<color:#d8e2dc>Check which catches the Pyro Fishing shop accepts with <click:run_command:'/fish shop'><hover:show_text:'Open /fish shop.'><color:#ffd166>/fish shop</color></hover></click>.</color>"
  - "helpers|<color:#d8e2dc>Need a hand? Ask a community helper or another player. You can also find support through <click:run_command:'/discord'><hover:show_text:'Open /discord.'><color:#ffd166>/discord</color></hover></click>.</color>"
  - "mcmmo_booster|<color:#d8e2dc>Check <click:run_command:'/rate'><hover:show_text:'Open /rate.'><color:#ffd166>/rate</color></hover></click> for current mcMMO boosters before your next skill session.</color>"
  - "here|<color:#d8e2dc>Learn more about your current location with <click:run_command:'/here'><hover:show_text:'Open /here.'><color:#ffd166>/here</color></hover></click>.</color>"
  - "vote_tokens|<color:#d8e2dc>Review your vote-token collection and its available trades with <click:run_command:'/votetokens'><hover:show_text:'Open /votetokens.'><color:#ffd166>/votetokens</color></hover></click>.</color>"
  - "jobs_booster|<color:#d8e2dc>Check <click:run_command:'/rate'><hover:show_text:'Open /rate.'><color:#ffd166>/rate</color></hover></click> for current Jobs boosters before planning your next earning session.</color>"
  - "oneblock_team|<color:#d8e2dc>In OneBlock, an island owner can invite a friend with <click:suggest_command:'/oneblock team invite '><hover:show_text:'Put /oneblock team invite in chat; review it before sending.'><color:#ffd166>/oneblock team invite</color></hover></click> followed by their name.</color>"
  - "portals|<color:#d8e2dc>For the regular Nether and End, review <click:suggest_command:'/nether'><hover:show_text:'Put /nether in chat; review it before sending.'><color:#ffd166>/nether</color></hover></click> and <click:suggest_command:'/end'><hover:show_text:'Put /end in chat; review it before sending.'><color:#ffd166>/end</color></hover></click> before travelling.</color>"
  - "pointy_fish|<color:#d8e2dc>Eat special Pointy Fish to earn welcome points. See <click:run_command:'/points'><hover:show_text:'Open /points.'><color:#ffd166>/points</color></hover></click> for the points shop.</color>"
  - "server_version|<color:#d8e2dc>Welcome to the 1MoreBlock.com Third Era server.</color>"
  - "jump_perk|<color:#d8e2dc>Builders and higher groups can use <click:suggest_command:'/j'><hover:show_text:'Put /j in chat; review it before sending.'><color:#ffd166>/j</color></hover></click> to jump towards the place they are looking. Check the landing spot first.</color>"
  - "fish_tournament|<color:#d8e2dc>Check <click:run_command:'/fisht info'><hover:show_text:'Open /fisht info.'><color:#ffd166>/fisht info</color></hover></click> to see whether a fishing tournament is active and read its current information.</color>"
  - "farm_tournament|<color:#d8e2dc>Check <click:run_command:'/farmt info'><hover:show_text:'Open /farmt info.'><color:#ffd166>/farmt info</color></hover></click> to see whether a farming tournament is active and read its current information.</color>"
  - "utility_commands|<color:#d8e2dc>Your group has portable crafting access. Open <click:run_command:'/craft'><hover:show_text:'Open /craft.'><color:#ffd166>/craft</color></hover></click> when you need a crafting table.</color>"
  - "utility_enderchest|<color:#d8e2dc>Your group has portable Ender Chest access. Open <click:run_command:'/ec'><hover:show_text:'Open /ec.'><color:#ffd166>/ec</color></hover></click> to use it.</color>"
  - "utility_anvil|<color:#d8e2dc>Your group has portable anvil access. Open <click:run_command:'/anvil'><hover:show_text:'Open /anvil.'><color:#ffd166>/anvil</color></hover></click> and review any repair costs before confirming.</color>"
  - "autosell|<color:#d8e2dc>Want help clearing ordinary inventory items? Open <click:run_command:'/autosell'><hover:show_text:'Open /autosell.'><color:#ffd166>/autosell</color></hover></click> to choose what may be sold. AutoSell starts off until you choose to enable it.</color>"
  - "forage|<color:#d8e2dc>Discover camps, gathering tools and quests with Forage. Use <click:run_command:'/forage next'><hover:show_text:'Open /forage next.'><color:#ffd166>/forage next</color></hover></click> for your next available step.</color>"
  - "afkshrine|<color:#d8e2dc>Qualifying AFK sessions can build AFKShrine progress. Open <click:run_command:'/afkshrine gui'><hover:show_text:'Open /afkshrine gui.'><color:#ffd166>/afkshrine gui</color></hover></click> to review pending tokens, goals and rewards when you return.</color>"
  - "discordchat|<color:#d8e2dc>Linked Discord accounts can earn progress through meaningful server-chat activity. Open <click:run_command:'/discordchat'><hover:show_text:'Open /discordchat.'><color:#ffd166>/discordchat</color></hover></click> to see your progress and available rewards.</color>"
  - "emotes|<color:#d8e2dc>Find a fun way to greet someone with <click:run_command:'/emotes'><hover:show_text:'Open /emotes.'><color:#ffd166>/emotes</color></hover></click>. The menu helps you choose an emote and, when needed, a player.</color>"
  - "player_todo|<color:#d8e2dc>Keep personal building plans and reminders in <click:run_command:'/todo'><hover:show_text:'Open /todo.'><color:#ffd166>/todo</color></hover></click>. Add a note with <click:suggest_command:'/todo '><hover:show_text:'Put /todo in chat; review it before sending.'><color:#ffd166>/todo</color></hover></click>.</color>"
  - "chunks|<color:#d8e2dc>Open <click:run_command:'/chunks'><hover:show_text:'Open /chunks.'><color:#ffd166>/chunks</color></hover></click> to choose your server view distance. A lower setting can help a slower connection; your client settings still limit what you see.</color>"
  - "mobhat|<color:#d8e2dc>Browse cosmetic mob hats with <click:run_command:'/mobhat list'><hover:show_text:'Open /mobhat list.'><color:#ffd166>/mobhat list</color></hover></click>. Available mobs depend on your unlocks, and equipping a hat leaves the real mob in place.</color>"
  - "skyblock|<color:#d8e2dc>Try a different style of survival: explore <click:run_command:'/gametype menu skyblock'><hover:show_text:'Open /gametype menu skyblock.'><color:#ffd166>SkyBlock</color></hover></click> in the game-type menu.</color>"
  - "acid|<color:#d8e2dc>Try a different style of survival: explore <click:run_command:'/gametype menu acid'><hover:show_text:'Open /gametype menu acid.'><color:#ffd166>AcidIsland</color></hover></click> in the game-type menu.</color>"
  - "cave|<color:#d8e2dc>Try a different style of survival: explore <click:run_command:'/gametype menu cave'><hover:show_text:'Open /gametype menu cave.'><color:#ffd166>CaveBlock</color></hover></click> in the game-type menu.</color>"
  - "skygrid|<color:#d8e2dc>Try a different style of survival: explore <click:run_command:'/gametype menu skygrid'><hover:show_text:'Open /gametype menu skygrid.'><color:#ffd166>SkyGrid</color></hover></click> in the game-type menu.</color>"
  - "chunkblock|<color:#d8e2dc>Try a different style of survival: explore <click:run_command:'/gametype menu chunkblock'><hover:show_text:'Open /gametype menu chunkblock.'><color:#ffd166>ChunkBlock</color></hover></click> in the game-type menu.</color>"
